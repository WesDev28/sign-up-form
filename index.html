<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
    <div class="imgContainer">
        <img class="bg-image" src="./images/sichen-xiang-hNuj3VEpScw-unsplash.jpg">
        
        <div class="odin-banner">
            <img class="odin-logo" src="./images/odin-lined.png">
            <p class="odin-text">ODIN</p>            
        </div>
    </div>
    
    <div class="pageBox">
        <div class="textRow">
            <blockquote>
            <p>This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up now to 
            get started.</p>
            
            <p>You know you want to.</p>
            </blockquote>
        </div>

        <form id="signupForm" action="https://httpbin.org/post" method="post">
            <h1> Lets do this!</h1>
            <div class="formRow">
                <p class="inputField">
                <label for="firstName">FIRST NAME</label>
                <input type="text" id="firstName"name="firstName" required/>
                </p>

                <p class="inputField">
                <label for="lastName">LAST NAME</label>
                <input type="text" id="lastName"name="lastName" required/>
                </p>
            </div>

            <div class="formRow">
                <p class="inputField">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required/>
                </p>

                <p class="inputField">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone"
                pattern="^((((\+44\s?([0-6]|[8-9])\d{3}|\(?0([0-6]|[8-9])\d{3}\)?)\s?\d{3}\s?(\d{2}|\d{3}))|((\+44\s?([0-6]|[8-9])\d{3}|\(?0([0-6]|[8-9])\d{3}\)?)\s?\d{3}\s?(\d{4}|\d{3}))|((\+44\s?([0-6]|[8-9])\d{1}|\(?0([0-6]|[8-9])\d{1}\)?)\s?\d{4}\s?(\d{4}|\d{3}))|((\+44\s?\d{4}|\(?0\d{4}\)?)\s?\d{3}\s?\d{3})|((\+44\s?\d{3}|\(?0\d{3}\)?)\s?\d{3}\s?\d{4})|((\+44\s?\d{2}|\(?0\d{2}\)?)\s?\d{4}\s?\d{4})))(?:[\s\-]?(?:x|ext\.?|#)\d{3,4})?$"
                title="Enter a valid UK phone number"
                required />
                </p>
            </div>

            <div class="formRow">
                <p class="inputField">
                <label for="pass1">PASSWORD</label>
                <input type="password" id="pass1" name="pass1" minlength="3"
                 maxlength="20" required/>
                </p>

                <p class="inputField">
                <label for="pass2">CONFIRM PASSWORD</label>
                <input type="password" id="pass2" name="pass2" minlength="3"
                maxlength="20" required/>
                </p>
            </div>
        </form>

        <div class="submitRow">
            <button type="submit" form="signupForm" class="submitBtn"> 
            Create Account
            </button>
            <p> Already have an account? <a href=""> Log in </a></p>
        </div>
    
    </div>

</body>

</html>
