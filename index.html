<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
    <div class="imgContainer">
        <img class="bg-image" src="./images/sichen-xiang-hNuj3VEpScw-unsplash.jpg">
        
        <div class="odin-banner">
            <img class="odin-logo" src="./images/odin-lined.png">
            <p class="odin-text">ODIN</p>            
        </div>
    </div>
    
    <div class="pageBox">
        <div class="textRow">
            <blockquote>
            <p>This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up now to 
            get started.</p>
            
            <p>You know you want to.</p>
            </blockquote>
        </div>

        <form>
            <h1> LETS DO THIS!</h1>
            <div class="formRow">
                <p class="inputField">
                <label for="firstName">FIRSTNAME</label>
                <input type="text" id="firstName"name="firstName" required/>
                </p>

                <p class="inputField">
                <label for="lastName">LASTNAME</label>
                <input type="text" id="lastName"name="lastName" required/>
                </p>
            </div>

            <div class="formRow">
                <p class="inputField">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required/>
                </p>

                <p class="inputField">
                <label for="phone">PHONE NUMBER</label>
                <input type="number" id="phone" name="phone" required/>
                </p>
            </div>

            <div class="formRow">
                <p class="inputField">
                <label for="pass1">PASSWORD</label>
                <input type="password" id="pass1" name="pass1" required/>
                </p>

                <p class="inputField">
                <label for="pass2">PASSWORD</label>
                <input type="password" id="pass2" name="pass2" required/>
                </p>
            </div>
        </form>

        <div class="submitRow">
            <button class="submit"> Create Account </button>
            <p> Already have an account? <a href=""> Log in <a></p>
        </div>
    
    </div>

</body>

</html>
